# Limine config: read by the bootloader from /boot/limine/limine.conf on the ISO.

# Seconds to wait in the boot menu before booting the default entry.
timeout: 3

# One boot menu entry. The name after "/" is shown in the menu.
/MyOS
    # Use the Limine boot protocol (kernel is a 64-bit ELF with Limine requests).
    protocol: limine

    # Where the kernel file is. boot():/ means "the disk/partition this config was loaded from".
    path: boot():/boot/kernel
